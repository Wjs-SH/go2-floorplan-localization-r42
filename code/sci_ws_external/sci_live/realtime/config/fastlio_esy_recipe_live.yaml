# fastlio_esy_recipe_live.yaml (2026-10-09) — esy 레시피(로봇 ~/fastlio_fix_20261008/fastlio_esy_recipe.yaml)를 그대로 복사하고
# imu_topic 한 줄만 바꿨다: /utlidar/imu → /utlidar/imu_ref.
#   로스백은 IMU 헤더를 LiDAR 시계에 미리 올리고 자이로 바이어스를 뺀 bag 을 넣었다(esy make_ref_bag.py).
#   실시간에서는 tools/esy_inputs_bridge.py 가 같은 계산으로 /utlidar/imu_ref 를 낸다(200 Hz 재샘플만 빠짐).
# 이 설정은 esy 수정 FAST-LIO(../fastlio_ws, lidar_type 5 = Hesai) 전용이다. go2_ws FAST-LIO 에서는 lidar_type 5 가 없다.
/**:
    ros__parameters:
        feature_extract_enable: false
        point_filter_num: 4
        max_iteration: 5
        filter_size_surf: 0.25
        filter_size_map: 0.25
        cube_side_length: 1000.0
        runtime_pos_log_enable: false
        map_file_path: "./t.pcd"
        common:
            lid_topic: "/lidar_points"
            imu_topic: "/utlidar/imu_ref"
            time_sync_en: false
            # Conditioned flower bags already place IMU stamps on LiDAR time.
            time_offset_lidar_to_imu: 0.0
        preprocess:
            lidar_type: 5
            scan_line: 16
            scan_rate: 10
            timestamp_unit: 0
            blind: 0.5
        mapping:
            acc_cov: 3.0
            gyr_cov: 0.3
            b_acc_cov: 0.0001
            b_gyr_cov: 0.00001
            fov_degree: 360.0
            det_range: 100.0
            extrinsic_est_en: false
            extrinsic_T: [0.171, 0.0, -0.0908]
            extrinsic_R: [-0.7469, -0.6523, 0.1289,
                          -0.6606, 0.7059, -0.2556,
                          0.0758, -0.2761, -0.9581]
        publish:
            path_en: false
            scan_publish_en: true
            dense_publish_en: false
            scan_bodyframe_pub_en: false
        pcd_save:
            pcd_save_en: false
            interval: -1
